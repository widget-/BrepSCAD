[workspace]
resolver = "3"
exclude = ["vendor/truck-*"]
members = [
    "crates/cli",
    "crates/kernel-api",
    "crates/kernel-truck",
    "crates/raycast",
    "crates/scad-eval",
    "crates/scad-syntax",
    "crates/viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"

[workspace.dependencies]
anyhow = "1"
rowan = "0.16"
thiserror = "2"
truck-meshalgo = { version = "0.4", default-features = false, features = ["analyzers", "tessellation"] }
truck-modeling = "0.6"
truck-shapeops = { version = "0.4", default-features = false }
clipper2-rust = "1.2"

brepscad-kernel-api = { path = "crates/kernel-api" }
brepscad-kernel-truck = { path = "crates/kernel-truck" }
brepscad-raycast = { path = "crates/raycast" }
brepscad-eval = { path = "crates/scad-eval" }
brepscad-syntax = { path = "crates/scad-syntax" }

[patch.crates-io]
truck-base = { path = "vendor/truck-base" }
truck-derivers = { path = "vendor/truck-derivers" }
truck-geotrait = { path = "vendor/truck-geotrait" }
truck-geometry = { path = "vendor/truck-geometry" }
truck-topology = { path = "vendor/truck-topology" }
truck-polymesh = { path = "vendor/truck-polymesh" }
truck-meshalgo = { path = "vendor/truck-meshalgo" }
truck-modeling = { path = "vendor/truck-modeling" }
truck-shapeops = { path = "vendor/truck-shapeops" }
