[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/kernel-api",
    "crates/kernel-truck",
    "crates/scad-eval",
    "crates/scad-syntax",
    "crates/viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"

[workspace.dependencies]
anyhow = "1"
rowan = "0.16"
thiserror = "2"
truck-meshalgo = { version = "0.4", default-features = false, features = ["analyzers", "tessellation"] }
truck-modeling = "0.6"
truck-shapeops = { version = "0.4", default-features = false }

visual-openscad-kernel-api = { path = "crates/kernel-api" }
visual-openscad-kernel-truck = { path = "crates/kernel-truck" }
visual-openscad-scad-eval = { path = "crates/scad-eval" }
visual-openscad-scad-syntax = { path = "crates/scad-syntax" }
