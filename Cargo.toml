[workspace]
resolver = "3"
exclude = ["vendor/truck-*", "vendor/monstertruck-*"]
members = [
    "crates/cli",
    "crates/kernel-api",
    "crates/kernel-truck",
    "crates/raycast",
    "crates/scad-eval",
    "crates/scad-lsp",
    "crates/scad-syntax",
    "crates/viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"

[workspace.dependencies]
anyhow = "1"
rowan = "0.17"
thiserror = "2"
monstertruck-meshing = { version = "0.4", default-features = false, features = ["analyzers", "tessellation"] }
monstertruck-modeling = "0.4"
monstertruck-solid = "0.4"
clipper2-rust = "1.2"

brepscad-kernel-api = { path = "crates/kernel-api" }
brepscad-kernel-truck = { path = "crates/kernel-truck" }
brepscad-raycast = { path = "crates/raycast" }
brepscad-eval = { path = "crates/scad-eval" }
brepscad-syntax = { path = "crates/scad-syntax" }

[patch.crates-io]
monstertruck-solid = { path = "vendor/monstertruck-solid" }
monstertruck-topology = { path = "vendor/monstertruck-topology" }
