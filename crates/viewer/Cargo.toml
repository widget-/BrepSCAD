[package]
name = "visual-openscad-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
glam = "0.34"
wgpu = { version = "25", default-features = false, features = ["vulkan", "gles", "wgsl"] }
visual-openscad-kernel-api.workspace = true
visual-openscad-kernel-truck.workspace = true
visual-openscad-scad-eval.workspace = true
