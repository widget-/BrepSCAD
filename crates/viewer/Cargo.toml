[package]
name = "brepscad-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
glam = "0.34"
rfd = "0.17"
serde_json = "1"
url = "2"
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles", "wgsl"] }
brepscad-kernel-api.workspace = true
brepscad-kernel-truck.workspace = true
brepscad-eval.workspace = true
brepscad-raycast.workspace = true
brepscad-syntax.workspace = true
