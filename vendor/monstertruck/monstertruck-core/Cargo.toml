[package]
name = "monstertruck-core"
version = "0.4.1"
authors = ["Yoshinori Tanimura <tanimura@ricos.co.jp>", "Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
description = "Core types and traits for linear algebra, curves, surfaces, and tolerances"
homepage = "https://github.com/virtualritz/monstertruck"
repository = "https://github.com/virtualritz/monstertruck"
license = "Apache-2.0"

keywords = ["truck", "graphics"]
categories = ["graphics"]

[features]
rkyv = ["dep:rkyv"]
# Records the lineage of each geometry object through the operations that made
# it. Off by default: without it the module does not exist and no call site is
# compiled, so a release build pays nothing.
provenance = []

[dependencies]
cgmath = { workspace = true }
matext4cgmath = { workspace = true }
rkyv = { workspace = true, optional = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
xxhash-rust = { workspace = true }

