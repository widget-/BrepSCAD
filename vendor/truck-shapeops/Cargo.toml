[package]
name = "truck-shapeops"
version = "0.4.0"
edition = "2021"
description = "Provides boolean operations to Solid"
homepage = "https://github.com/ricosjp/truck"
repository = "https://github.com/ricosjp/truck"
license = "Apache-2.0"

[features]
default = ["step-test"]
step-test = ["truck-stepio"]

[dependencies]
derive_more = { version = "2.1.1", features = ["full"] }
rustc-hash = "2.1.3"
itertools = "0.15.0"
truck-base = "0.5.0"
truck-geometry = "0.5.0"
truck-topology = "0.6.0"
truck-meshalgo = "0.4.0"

truck-geotrait = "0.4.0"
truck-stepio = { version = "0.3.0", optional = true }

[dev-dependencies]
rand = "0.10.3"
serde_json = "1.0.154"
truck-modeling = "0.6.0"
proptest = { version = "1.12.0", features = ["attr-macro"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
